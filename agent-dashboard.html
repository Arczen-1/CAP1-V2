<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capstone Agent Team — Live</title>
<style>
  :root {
    --ground:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f6; --border:#e0e5ec;
    --text:#181d29; --muted:#5c6675; --faint:#8b95a5;
    --accent:#4f46e5; --accent-soft:#ecebfe; --accent-ink:#3730a3;
    --lead:#5b57e6; --research:#0d9488; --dev:#2563eb; --test:#c2620a; --panel:#7c3aed;
    --good:#15803d; --good-bg:#e6f6ec; --warn:#b45309; --warn-bg:#fbeede; --crit:#b91c1c; --crit-bg:#fbe9e9;
    --mono: ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
    --sans: ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 6px 20px -12px rgba(20,25,40,.18);
  }
  @media (prefers-color-scheme: dark){ :root{
    --ground:#0a0e16; --surface:#111826; --surface-2:#0d1420; --border:#212b3d;
    --text:#e7ebf3; --muted:#98a3b4; --faint:#6b7688;
    --accent:#818cf8; --accent-soft:#1c2145; --accent-ink:#c7cbff;
    --lead:#8b93f9; --research:#2dd4bf; --dev:#60a5fa; --test:#fbbf24; --panel:#c084fc;
    --good:#4ade80; --good-bg:#0f2a1b; --warn:#fbbf24; --warn-bg:#2a1f0a; --crit:#f87171; --crit-bg:#2a1214;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }}
  :root[data-theme="dark"]{
    --ground:#0a0e16; --surface:#111826; --surface-2:#0d1420; --border:#212b3d;
    --text:#e7ebf3; --muted:#98a3b4; --faint:#6b7688;
    --accent:#818cf8; --accent-soft:#1c2145; --accent-ink:#c7cbff;
    --lead:#8b93f9; --research:#2dd4bf; --dev:#60a5fa; --test:#fbbf24; --panel:#c084fc;
    --good:#4ade80; --good-bg:#0f2a1b; --warn:#fbbf24; --warn-bg:#2a1f0a; --crit:#f87171; --crit-bg:#2a1214;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --ground:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f6; --border:#e0e5ec;
    --text:#181d29; --muted:#5c6675; --faint:#8b95a5;
    --accent:#4f46e5; --accent-soft:#ecebfe; --accent-ink:#3730a3;
    --lead:#5b57e6; --research:#0d9488; --dev:#2563eb; --test:#c2620a; --panel:#7c3aed;
    --good:#15803d; --good-bg:#e6f6ec; --warn:#b45309; --warn-bg:#fbeede; --crit:#b91c1c; --crit-bg:#fbe9e9;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 6px 20px -12px rgba(20,25,40,.18);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--ground); color:var(--text); font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:var(--mono); }
  .wrap{ max-width:1080px; margin:0 auto; padding:22px clamp(14px,3vw,28px) 60px; }
  h1,h2,h3{ margin:0; letter-spacing:-.01em; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .brand{ display:flex; align-items:center; gap:13px; }
  .glyph{ width:44px; height:44px; border-radius:12px; flex:none; background:linear-gradient(150deg,var(--accent),var(--panel)); color:#fff; display:grid; place-items:center; font-size:22px; box-shadow:var(--shadow); }
  .brand h1{ font-size:clamp(1.2rem,2.3vw,1.55rem); font-weight:680; }
  .brand .sub{ color:var(--muted); font-size:.86rem; margin-top:2px; }
  .channel{ font-family:var(--mono); color:var(--accent); font-weight:600; }

  .status{ display:inline-flex; align-items:center; gap:9px; font-size:.82rem; color:var(--muted); background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:7px 14px; box-shadow:var(--shadow); }
  .live-dot{ width:9px; height:9px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent); }
  @media (prefers-reduced-motion:no-preference){ .live .live-dot{ animation:pulse 1.8s ease-out infinite; } }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent);} 70%{ box-shadow:0 0 0 7px transparent;} 100%{ box-shadow:0 0 0 0 transparent;} }
  .status.stale .live-dot{ background:var(--warn); } .status.down .live-dot{ background:var(--crit); }

  .watching{ font-size:.78rem; color:var(--faint); margin:8px 0 20px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); margin-bottom:18px; overflow:hidden; }
  .card>.hd{ padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .card>.hd h2{ font-size:.74rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:680; }
  .card>.bd{ padding:14px 16px; }

  .empty{ text-align:center; padding:44px 20px; color:var(--muted); }
  .empty .big{ font-size:2.4rem; }
  .empty h3{ font-size:1.05rem; margin:10px 0 6px; color:var(--text); }
  .empty code{ font-family:var(--mono); background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:3px 8px; font-size:.85rem; display:inline-block; margin-top:6px; }

  .pill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-weight:700; font-size:.68rem; letter-spacing:.02em; padding:3px 8px; border-radius:999px; border:1px solid transparent; white-space:nowrap; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .p-good{ color:var(--good); background:var(--good-bg); border-color:color-mix(in srgb,var(--good) 30%,transparent); }
  .p-warn{ color:var(--warn); background:var(--warn-bg); border-color:color-mix(in srgb,var(--warn) 30%,transparent); }
  .p-crit{ color:var(--crit); background:var(--crit-bg); border-color:color-mix(in srgb,var(--crit) 30%,transparent); }
  .p-idle{ color:var(--faint); background:var(--surface-2); border-color:var(--border); }

  /* change card */
  .change{ border:1px solid var(--border); border-radius:12px; margin-bottom:12px; background:var(--surface); }
  .change>summary{ list-style:none; cursor:pointer; padding:13px 15px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .change>summary::-webkit-details-marker{ display:none; }
  .change .cid{ font-family:var(--mono); font-weight:700; font-size:.8rem; color:var(--accent); }
  .change .ctitle{ font-weight:600; font-size:.94rem; flex:1; min-width:180px; }
  .stages{ display:flex; flex-wrap:wrap; gap:6px; padding:0 15px 13px; }
  .stage{ display:flex; align-items:center; gap:7px; font-size:.74rem; border:1px solid var(--border); border-radius:8px; padding:4px 9px; background:var(--surface-2); color:var(--muted); }
  .stage .s-num{ font-family:var(--mono); font-weight:700; font-size:.66rem; color:var(--faint); }
  .stage.done{ border-color:color-mix(in srgb,var(--good) 32%,transparent); color:var(--text); background:var(--good-bg); }
  .stage.warn{ border-color:color-mix(in srgb,var(--warn) 32%,transparent); color:var(--text); background:var(--warn-bg); }
  .stage.crit{ border-color:color-mix(in srgb,var(--crit) 32%,transparent); color:var(--text); background:var(--crit-bg); }
  .reports{ border-top:1px solid var(--border); padding:12px 15px; display:flex; flex-direction:column; gap:8px; }
  .report{ border:1px solid var(--border); border-radius:9px; background:var(--surface-2); }
  .report>summary{ cursor:pointer; padding:8px 12px; font-family:var(--mono); font-size:.78rem; font-weight:640; color:var(--muted); list-style:none; display:flex; align-items:center; gap:8px; }
  .report>summary::-webkit-details-marker{ display:none; }
  .report>summary .chev{ transition:transform .15s; }
  .report[open]>summary .chev{ transform:rotate(90deg); }
  .report pre{ margin:0; padding:12px; border-top:1px solid var(--border); font-family:var(--mono); font-size:.78rem; line-height:1.5; white-space:pre-wrap; word-break:break-word; max-height:420px; overflow:auto; }

  /* run log */
  .logbox{ font-family:var(--mono); font-size:.76rem; line-height:1.5; background:#0b1020; color:#cdd6f4; border-radius:10px; padding:12px 14px; max-height:340px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  :root[data-theme="light"] .logbox{ background:#0f1526; }
  .runmeta{ font-size:.76rem; color:var(--muted); margin-bottom:8px; display:flex; gap:12px; flex-wrap:wrap; }
  .runmeta .mono{ color:var(--text); }

  details.card-x{ }
  .foot{ color:var(--faint); font-size:.78rem; text-align:center; margin-top:30px; }
  a{ color:var(--accent); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="glyph">🤖</div>
      <div>
        <h1>Capstone Agent Team</h1>
        <div class="sub"><span class="channel">#capstone-agents</span> · live view of real runs</div>
      </div>
    </div>
    <div class="status live" id="status"><span class="live-dot"></span><span id="statusText">Connecting…</span></div>
  </div>
  <div class="watching" id="watching"></div>

  <div id="content"><!-- rendered live --></div>

  <p class="foot">Reads <span class="mono">agent-artifacts/</span> on disk every 3s · start a run with <span class="mono">.\Start-CapstoneAgents.ps1</span></p>
</div>

<script>
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;"; }); };
  var ago = function (ms) {
    if (!ms) return "";
    var d = Math.max(0, Date.now() - ms), s = Math.round(d / 1000);
    if (s < 60) return s + "s ago";
    var m = Math.round(s / 60); if (m < 60) return m + "m ago";
    var h = Math.round(m / 60); if (h < 24) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  };
  function statusPill(status) {
    if (!status) return '<span class="pill p-idle">pending</span>';
    var cls = status === "ALIGNED" ? "p-good"
      : status === "ALIGNED WITH CONDITIONS" ? "p-warn"
      : "p-crit";
    return '<span class="pill ' + cls + '">' + esc(status) + "</span>";
  }
  function verdictPill(v) {
    if (!v) return "";
    var cls = v === "PASS" ? "p-good" : v === "PASS WITH MINOR OBSERVATIONS" ? "p-warn" : "p-crit";
    return '<span class="pill ' + cls + '">' + esc(v) + "</span>";
  }
  function finalPill(f) {
    if (!f) return "";
    var cls = f === "COMPLETE" ? "p-good" : "p-crit";
    return '<span class="pill ' + cls + '">' + esc(f) + "</span>";
  }

  var REPORT_LABELS = {
    request: "request.md",
    thesisAlignment: "thesis-alignment.md",
    researchReport: "research-report.md",
    acceptanceCriteria: "acceptance-criteria.md",
    implementationReport: "implementation-report.md",
    testReport: "test-report.md",
    gitDiff: "git-diff-summary.md",
    panelDefense: "panel-defense.md",
    finalStatus: "final-status.md",
  };

  function stageRow(c) {
    var blocked = c.status === "BLOCKED" || c.status === "SCOPE CONFLICT";
    var s = [];
    s.push(stageChip("1", "Intake", c.present.request ? "done" : ""));
    s.push(stageChip("2", "Research" + (c.status ? " · " + c.status : ""), c.status ? (blocked ? "crit" : (c.status === "ALIGNED WITH CONDITIONS" ? "warn" : "done")) : ""));
    s.push(stageChip("3", "Gate", c.status ? (blocked ? "crit" : "done") : ""));
    s.push(stageChip("4", "Implement", c.present.implementationReport ? "done" : (blocked ? "crit" : "")));
    var vcls = c.verdict ? (c.verdict === "PASS" ? "done" : c.verdict === "PASS WITH MINOR OBSERVATIONS" ? "warn" : "crit") : (blocked ? "crit" : "");
    s.push(stageChip("5", "Test" + (c.verdict ? " · " + c.verdict : ""), vcls));
    s.push(stageChip("6", "Panel", c.present.panelDefense ? "done" : ""));
    s.push(stageChip("7", "Commit" + (c.finalStatus ? " · " + c.finalStatus : ""), c.finalStatus ? (c.finalStatus === "COMPLETE" ? "done" : "crit") : ""));
    return '<div class="stages">' + s.join("") + "</div>";
  }
  function stageChip(num, label, cls) {
    return '<span class="stage ' + (cls || "") + '"><span class="s-num">' + num + "</span>" + esc(label) + "</span>";
  }

  function renderChange(c) {
    var reports = "";
    Object.keys(REPORT_LABELS).forEach(function (k) {
      if (c.reports && c.reports[k] != null) {
        reports += '<details class="report"><summary><span class="chev">▸</span>' + esc(REPORT_LABELS[k]) + "</summary><pre>" + esc(c.reports[k]) + "</pre></details>";
      }
    });
    if (!reports) reports = '<div style="color:var(--faint);font-size:.82rem">No report files written yet.</div>';
    var head =
      '<summary>' +
        '<span class="cid">' + esc(c.id) + "</span>" +
        '<span class="ctitle">' + esc(c.title) + "</span>" +
        statusPill(c.status) + verdictPill(c.verdict) + finalPill(c.finalStatus) +
      "</summary>";
    return '<details class="change">' + head + stageRow(c) + '<div class="reports">' + reports + "</div></details>";
  }

  function renderRun(r) {
    if (!r) return "";
    return '<div class="card"><div class="hd"><h2>Active run log</h2><span class="pill p-idle">' + esc(r.name) + " · " + ago(r.mtime) + "</span></div><div class=\"bd\">" +
      '<div class="runmeta"><span>file <span class="mono">agent-artifacts/runs/' + esc(r.name) + '</span></span><span>' + (r.size || 0) + " bytes</span></div>" +
      '<div class="logbox" id="logbox">' + esc(r.tail || "(empty)") + "</div></div></div>";
  }

  function render(data) {
    var el = document.getElementById("content");
    document.getElementById("watching").textContent = "Watching: " + data.artifactsDir;

    if (!data.exists || (data.changes.length === 0 && data.runs.length === 0 && !data.nightlySummary)) {
      el.innerHTML =
        '<div class="card"><div class="empty">' +
          '<div class="big">🗂️</div>' +
          "<h3>No agent runs yet</h3>" +
          "<p>This page goes live the moment your agents start writing reports.</p>" +
          "<code>.\\Start-CapstoneAgents.ps1</code>" +
          '<p style="margin-top:16px;font-size:.82rem">Run logs appear here as the team works; each change fills in Intake → Research → Gate → Implement → Test → Panel → Commit as the reports land in <span class="mono">agent-artifacts/changes/</span>.</p>' +
        "</div></div>";
      return;
    }

    var html = "";
    // preserve which reports/changes were open
    var openIds = {};
    document.querySelectorAll(".change[open]").forEach(function (d) { openIds[d.querySelector(".cid").textContent] = true; });

    if (data.runs.length) html += renderRun(data.runs[0]);

    html += '<div class="card"><div class="hd"><h2>Changes · ' + data.changes.length + "</h2></div><div class=\"bd\">";
    if (data.changes.length === 0) html += '<div style="color:var(--muted);font-size:.86rem">No change folders yet in agent-artifacts/changes/.</div>';
    else html += data.changes.map(renderChange).join("");
    html += "</div></div>";

    if (data.nightlySummary) {
      html += '<details class="card"><summary style="cursor:pointer;padding:12px 16px;list-style:none;font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:680">Nightly summary ▾</summary><div class="bd"><div class="logbox" style="max-height:520px">' + esc(data.nightlySummary) + "</div></div></details>";
    }

    el.innerHTML = html;
    // restore open state
    Object.keys(openIds).forEach(function (id) {
      document.querySelectorAll(".change").forEach(function (d) {
        if (d.querySelector(".cid").textContent === id) d.setAttribute("open", "");
      });
    });
    // keep active log scrolled to bottom
    var lb = document.getElementById("logbox");
    if (lb) lb.scrollTop = lb.scrollHeight;
  }

  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  function setStatus(kind, text) {
    statusEl.className = "status " + kind;
    statusText.textContent = text;
  }

  async function poll() {
    try {
      var res = await fetch("/api/activity", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      var data = await res.json();
      render(data);
      setStatus("live", "Live · updated just now");
    } catch (e) {
      setStatus("down", "Disconnected — is agent-dashboard.mjs running?");
    }
  }
  poll();
  setInterval(poll, 3000);
</script>
</body>
</html>
